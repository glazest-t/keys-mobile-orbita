<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&amp;family=Unbounded:wght@500&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#e9ebf3;font-family:"Onest",system-ui,sans-serif;color:#101320}a{color:#2f5bff}a:hover{color:#1e44db}button{font-family:inherit;cursor:pointer}
.kp-scroll::-webkit-scrollbar{display:none}
@keyframes kpInF{from{opacity:0;transform:translateX(42%) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kpOutF{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-22%) scale(.96);filter:blur(4px)}}
@keyframes kpInB{from{opacity:0;transform:translateX(-42%) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kpOutB{from{opacity:1;transform:none}to{opacity:0;transform:translateX(22%) scale(.96);filter:blur(4px)}}
@keyframes kpInS{from{opacity:0;transform:scale(1.06);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kpOutS{from{opacity:1}to{opacity:0;transform:scale(.92);filter:blur(8px)}}
@keyframes kpSpin{to{transform:rotate(360deg)}}</style></helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px 36px;box-sizing:border-box">

<header style="width:100%;max-width:1180px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:10px"><span style="position:relative;width:26px;height:26px;display:inline-block"><span style="position:absolute;inset:0;border-radius:50%;border:4.9px solid #2f5bff;box-sizing:border-box"></span><span style="position:absolute;left:14.5px;top:1.2px;width:8.7px;height:8.7px;border-radius:50%;background:#2f5bff;box-shadow:0 0 0 1.6px #e9ebf3"></span></span><span style="font:500 20px/1 'Unbounded',sans-serif;letter-spacing:-1px">ключи</span><span style="font-size:13px;color:#5a6072;margin-left:6px">Прототип по сценариям</span></div>
<span style="font-size:12px;line-height:17px;color:#5a6072">Нажмите на экран — дальше · левый край — назад · ← → на клавиатуре</span>
</div>
<div class="kp-scroll" style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 40px 4px 4px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px #e1e5ec;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)">
<sc-for list="{{ scen }}" as="s" hint-placeholder-count="10"><button onClick="{{ s.pick }}" style="flex:none;height:38px;padding:0 14px;border:0;border-radius:14px;background:{{ s.bg }};color:{{ s.fg }};font-size:13px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:background .24s,color .24s"><span style="font:500 11px/1 'Unbounded',sans-serif;opacity:.7">{{ s.n }}</span>{{ s.title }}</button></sc-for>
</div>
</header>

<div style="width:100%;max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:28px;align-items:start">
<aside style="display:flex;flex-direction:column;gap:8px;padding-top:6px;min-width:0">
<span style="font:500 22px/28px 'Unbounded',sans-serif;letter-spacing:-.6px">{{ cur.title }}</span>
<span style="font-size:14px;line-height:21px;color:#5a6072;text-wrap:pretty">{{ cur.desc }}</span>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;white-space:nowrap"><button onClick="{{ prev }}" style="height:40px;padding:0 14px;border:1px solid #d5dbe8;border-radius:12px;background:#fff;color:#101320;font-size:13px;font-weight:500">← Назад</button><button onClick="{{ next }}" style="height:40px;padding:0 16px;border:0;border-radius:12px;background:#2f5bff;color:#fff;font-size:13px;font-weight:500">Дальше →</button><button onClick="{{ restart }}" style="height:40px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:#2f5bff;font-size:13px;font-weight:500">С начала</button></div>
</aside>

<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<div data-screen-label="{{ screenLabel }}" style="width:375px;height:800px;border-radius:52px;border:10px solid #0d0f17;background:#f4f5fb;overflow:hidden;position:relative;box-shadow:0 30px 60px #10132033;flex:none;isolation:isolate">
{{ stage }}
<div onClick="{{ prev }}" title="Назад" style="position:absolute;left:0;top:60px;bottom:120px;width:34px;z-index:30;cursor:w-resize"></div>
</div>
<div style="display:flex;gap:5px;align-items:center"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="6"><button onClick="{{ d.go }}" style="width:{{ d.w }};height:6px;border:0;padding:0;border-radius:3px;background:{{ d.bg }};transition:all .4s cubic-bezier(.2,.8,.2,1)"></button></sc-for></div>
<span style="font-size:12px;color:#5a6072">{{ stepLabel }}</span>
</div>

<aside style="display:flex;flex-direction:column;gap:4px;padding-top:6px;min-width:0">
<span style="font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#5a6072;padding:0 10px 6px">Шаги сценария</span>
<sc-for list="{{ steps }}" as="t" hint-placeholder-count="6"><button onClick="{{ t.go }}" style="display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;border-radius:12px;padding:8px 10px;background:{{ t.bg }};color:#101320;font-size:13px;line-height:18px;transition:background .24s"><span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 11px/1 'Unbounded',sans-serif;background:{{ t.nb }};color:{{ t.nf }};transition:all .24s">{{ t.n }}</span><span style="font-weight:{{ t.fw }}">{{ t.label }}</span></button></sc-for>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { si: 0, st: 0, dir: 'S', key: 0, screens: null, err: null };
  SCEN = [
    { title: 'Вход · гость', desc: 'Первый запуск: телефон, код из SMS, имя и онбординг. После — пустая страница «Поездки».', ids: ['o1', 'o2', 'o3', 'a1', 'a2', 'a3', 't1'] },
    { title: 'Вход · отельер', desc: 'Приглашение по ссылке, рабочий email из ЛК TravelLine, ожидание и подтверждение статуса. Затем — Friendly Rate в профиле и в цене отеля.', ids: ['fr1', 'z1', 'z2', 'z3', 'z5', 'fr2', 'fr6', 'fr3', 'fr5'] },
    { title: 'Нет брони · поиск', desc: 'Броней нет. Классический поиск, карта и фильтры, подбор по свайпу и по желаниям, избранное.', ids: ['t1', 'f1', 'k5', 'k3g', 'c1', 'k1', 'c2', 'q3', 'nc1', 'nc2', 'nc4', 'nc5', 'nc10', 'r1', 'fv1', 'fv2'] },
    { title: 'Поиск · есть лояльность отеля', desc: 'У гостя уже есть уровень в программе отеля: скидка отеля и баллы «Ключей» складываются в персональную цену.', ids: ['c1', 'h1', 'h2', 'tv2b', 'tv2c', 'h5', 'h6', 'h7', 'h8'] },
    { title: 'Поиск · нет лояльности отеля', desc: 'Программы отеля ещё нет: подключаем карту отеля прямо при бронировании, затем выбор номера и оплата.', ids: ['c1', 'h1', 'l1', 'tv2b', 'rm1', 'gl1', 'h5', 'h7', 'h8'] },
    { title: 'Бронь · до заезда', desc: 'Бронь есть, гость ещё не заехал: детали, как заселиться, маршрут, ранний заезд, регистрация, чат с отелем.', ids: ['u1b', 'd1', 'd4', 'd5', 'd5b', 'd6', 'b2', 'ch2'] },
    { title: 'Проживание', desc: 'Гость в номере: ключ, услуги, Wi‑Fi, счёт и «Есть проблема», места рядом.', ids: ['s2', 'sv1', 'sv2', 'wf1', 'wf1b', 's5', 's6', 'n1'] },
    { title: 'День выезда', desc: 'Выезд сегодня: счёт и депозит, поздний выезд, push-уведомления.', ids: ['s3', 's5', 'pn2', 'n2'] },
    { title: 'Поездка завершена', desc: 'После выезда: баллы на орбите, отзыв, документы, история баллов и поездок.', ids: ['s4', 'x2', 'd2', 'v1', 'v5', 'p3'] }
  ];
  componentDidMount() {
    try { const p = JSON.parse(localStorage.getItem('kp-proto-pos') || 'null'); if (p) this.setState({ si: Math.min(p.si, this.SCEN.length - 1), st: p.st || 0 }); } catch (e) {}
    this.onKey = e => { if (e.key === 'ArrowRight') this.go(1); if (e.key === 'ArrowLeft') this.go(-1); };
    window.addEventListener('keydown', this.onKey);
    fetch(encodeURI('Ключи - Все экраны.dc.html')).then(r => r.text()).then(t => {
      const doc = new DOMParser().parseFromString(t, 'text/html'), map = {};
      doc.querySelectorAll('[data-screen-label]').forEach(el => {
        const lab = el.getAttribute('data-screen-label'), id = lab.split(' ')[0];
        if (map[id] || !/^[a-z]/.test(id)) return;
        el.style.border = '0'; el.style.borderRadius = '0'; el.style.boxShadow = 'none'; el.style.margin = '0'; el.style.width = '355px';
        if (el.style.height === '780px') el.style.height = '780px';
        el.removeAttribute('data-screen-label');
        el.querySelectorAll('[data-comment-anchor]').forEach(x => x.removeAttribute('data-comment-anchor'));
        map[id] = { html: el.outerHTML, label: lab.slice(id.length + 1).replace(/^\d+\s·\s/, '') };
      });
      this.setState({ screens: map });
    }).catch(err => this.setState({ err: String(err) }));
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  save(si, st) { try { localStorage.setItem('kp-proto-pos', JSON.stringify({ si, st })); } catch (e) {} }
  ids() { const m = this.state.screens || {}; return this.SCEN[this.state.si].ids.filter(id => !this.state.screens || m[id]); }
  go(d) {
    const n = this.ids().length, st = this.state.st + d;
    if (st < 0 || st >= n) { if (d > 0 && this.state.si < this.SCEN.length - 1) return this.pickScen(this.state.si + 1); return; }
    this.prevHtml = this.html(this.state.st);
    this.setState(p => ({ st, dir: d > 0 ? 'F' : 'B', key: p.key + 1 })); this.save(this.state.si, st);
  }
  jump(i) { if (i === this.state.st) return; this.prevHtml = this.html(this.state.st); this.setState(p => ({ st: i, dir: i > p.st ? 'F' : 'B', key: p.key + 1 })); this.save(this.state.si, i); }
  pickScen(i) { this.prevHtml = this.html(this.state.st); this.setState(p => ({ si: i, st: 0, dir: 'S', key: p.key + 1 })); this.save(i, 0); }
  html(st) { const id = this.ids()[st], m = this.state.screens; return m && m[id] ? m[id].html : ''; }
  stageEl() {
    const E = React.createElement, s = this.state, D = s.dir;
    if (s.err) return E('div', { style: { padding: 40, fontSize: 14, color: '#5a6072' } }, 'Не удалось загрузить экраны: ' + s.err);
    if (!s.screens) return E('div', { style: { position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' } }, E('span', { style: { width: 40, height: 40, borderRadius: '50%', border: '7px solid #eef0ff', borderTopColor: '#2f5bff', animation: 'kpSpin .9s linear infinite' } }));
    const layer = (html, anim, k, z) => E('div', { key: k, className: 'kp-scroll', onClick: z === 2 ? (e) => { if (!e.target.closest('a')) this.go(1); } : undefined, style: { position: 'absolute', inset: 0, overflowY: 'auto', scrollbarWidth: 'none', background: '#f4f5fb', zIndex: z, cursor: 'pointer', animation: anim, pointerEvents: z === 2 ? 'auto' : 'none' }, dangerouslySetInnerHTML: { __html: html } });
    const ez = 'cubic-bezier(.2,.8,.2,1)';
    const inA = { F: 'kpInF .52s ' + ez + ' both', B: 'kpInB .52s ' + ez + ' both', S: 'kpInS .6s ' + ez + ' both' }[D];
    const outA = { F: 'kpOutF .42s cubic-bezier(.4,0,1,1) both', B: 'kpOutB .42s cubic-bezier(.4,0,1,1) both', S: 'kpOutS .4s cubic-bezier(.4,0,1,1) both' }[D];
    const kids = [];
    if (this.prevHtml && s.key > 0) kids.push(layer(this.prevHtml, outA, 'o' + s.key, 1));
    kids.push(layer(this.html(s.st), s.key > 0 ? inA : 'none', 'i' + s.key, 2));
    return E(React.Fragment, null, ...kids);
  }
  renderVals() {
    const s = this.state, sc = this.SCEN[s.si], ids = this.ids(), m = s.screens || {};
    return {
      scen: this.SCEN.map((x, i) => ({ title: x.title, n: String(i + 1).padStart(2, '0'), bg: i === s.si ? '#2f5bff' : 'transparent', fg: i === s.si ? '#fff' : '#101320', pick: () => this.pickScen(i) })),
      cur: sc, stage: this.stageEl(),
      prev: (e) => { e && e.stopPropagation && e.stopPropagation(); this.go(-1); }, next: () => this.go(1),
      restart: () => this.pickScen(s.si),
      screenLabel: (ids[s.st] || '') + ' ' + ((m[ids[s.st]] || {}).label || ''),
      stepLabel: 'Шаг ' + (s.st + 1) + ' из ' + ids.length + ((m[ids[s.st]] || {}).label ? ' · ' + m[ids[s.st]].label : ''),
      dots: ids.map((id, i) => ({ w: i === s.st ? '22px' : '6px', bg: i === s.st ? '#2f5bff' : i < s.st ? '#9fb0ff' : '#cdd3e1', go: () => this.jump(i) })),
      steps: ids.map((id, i) => ({ n: i + 1, label: (m[id] || {}).label || id, bg: i === s.st ? '#fff' : 'transparent', nb: i === s.st ? '#2f5bff' : i < s.st ? '#dfe5ff' : '#e9ecf3', nf: i === s.st ? '#fff' : i < s.st ? '#2f5bff' : '#5a6072', fw: i === s.st ? 500 : 400, go: () => this.jump(i) }))
    };
  }
}
</script>
</body>
</html>
