<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&amp;family=Unbounded:wght@500&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#e9ebf3;font-family:"Onest",system-ui,sans-serif;color:#101320}a{color:#2f5bff}a:hover{color:#1e44db}button{font-family:inherit;cursor:pointer}
.kc-scroll::-webkit-scrollbar{display:none}
@keyframes kcPushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes kcPushOut{to{transform:translateX(-28%);filter:brightness(.82)}}
@keyframes kcPopIn{from{transform:translateX(-28%);filter:brightness(.82)}to{transform:none;filter:none}}
@keyframes kcPopOut{to{transform:translateX(100%)}}
@keyframes kcTab{from{opacity:0}to{opacity:1}}
@keyframes kcSheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes kcDimIn{from{opacity:0}to{opacity:1}}
@keyframes kcSheetDown{to{transform:translateY(100%)}}
@keyframes kcDimOut{to{opacity:0}}
.kc-sheet-in [style*="border-radius:30px 30px 0 0"],.kc-sheet-in [style*="border-radius: 30px 30px 0px 0px"]{animation:kcSheetUp .46s cubic-bezier(.32,.72,0,1) both}
.kc-sheet-in [style*="background:#101320"][style*="inset:0"],[style*="background:#10132059"],.kc-sheet-in [style*="background: rgba(16, 19, 32, 0.35)"]{animation:kcDimIn .3s ease both}
.kc-sheet-out [style*="border-radius:30px 30px 0 0"],.kc-sheet-out [style*="border-radius: 30px 30px 0px 0px"]{animation:kcSheetDown .34s cubic-bezier(.4,0,1,1) both}
.kc-sheet-out [style*="background:#101320"][style*="inset:0"],[style*="background:#10132059"],.kc-sheet-out [style*="background: rgba(16, 19, 32, 0.35)"]{animation:kcDimOut .3s ease both}
@keyframes kcInF{from{opacity:0;transform:translateX(40%) scale(.95);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kcOutF{to{opacity:0;transform:translateX(-20%) scale(.96);filter:blur(4px)}}
@keyframes kcInB{from{opacity:0;transform:translateX(-40%) scale(.95);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kcOutB{to{opacity:0;transform:translateX(20%) scale(.96);filter:blur(4px)}}
@keyframes kcInU{from{opacity:0;transform:translateY(18%) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kcOutU{to{opacity:.4;transform:scale(.94);filter:blur(3px)}}
@keyframes kcInS{from{opacity:0;transform:scale(1.05);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kcOutS{to{opacity:0;transform:scale(.94);filter:blur(8px)}}
@keyframes kcToast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes kcSpin{to{transform:rotate(360deg)}}
.kc-scroll [data-kc-press],.kc-scroll [data-kc-hot]{cursor:pointer}
.kc-scroll [data-kc-press]{transition:transform .14s cubic-bezier(.2,.8,.2,1),filter .14s}
.kc-scroll [data-kc-press]:active{transform:scale(.97);filter:brightness(.96)}
.kc-scroll [data-kc-hot]:not([data-kc-press]):active{filter:brightness(.97)}
@keyframes kcKb{from{transform:translateY(100%)}to{transform:none}}
@keyframes kcCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes kcShake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.kc-hot [data-kc-hot]{outline:2px solid #2f5bff99;outline-offset:2px;border-radius:12px;transition:outline-color .2s}</style></helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 32px;box-sizing:border-box">
<header style="width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:10px"><span style="position:relative;width:26px;height:26px;display:inline-block"><span style="position:absolute;inset:0;border-radius:50%;border:4.9px solid #2f5bff;box-sizing:border-box"></span><span style="position:absolute;left:14.5px;top:1.2px;width:8.7px;height:8.7px;border-radius:50%;background:#2f5bff;box-shadow:0 0 0 1.6px #e9ebf3"></span></span><span style="font:500 20px/1 'Unbounded',sans-serif;letter-spacing:-1px">ключи</span><span style="font-size:13px;color:#5a6072;margin-left:6px">Кликабельный прототип</span></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;padding:4px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px #e1e5ec">
<sc-for list="{{ stages }}" as="s" hint-placeholder-count="6"><button onClick="{{ s.pick }}" style="height:34px;padding:0 12px;border:0;border-radius:12px;background:{{ s.bg }};color:{{ s.fg }};font-size:13px;font-weight:500;white-space:nowrap;transition:background .24s,color .24s">{{ s.label }}</button></sc-for>
</div>
</header>
<div style="display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;max-width:1100px">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<div data-screen-label="{{ screenLabel }}" style="width:375px;height:800px;box-sizing:content-box;border-radius:52px;border:10px solid #0d0f17;background:#f4f5fb;overflow:hidden;position:relative;box-shadow:0 30px 60px #10132033;flex:none;isolation:isolate">
{{ stage }}
</div>
<span style="font-size:12px;color:#5a6072;text-align:center;max-width:375px">{{ hint }}</span>
</div>
<aside style="width:260px;display:flex;flex-direction:column;gap:12px;padding-top:6px">
<span style="font:500 18px/24px 'Unbounded',sans-serif;letter-spacing:-.4px">{{ curLabel }}</span>
<span style="font-size:13px;line-height:19px;color:#5a6072">Нажимайте на кнопки, карточки, вкладки и стрелку «назад» — как в приложении. Синие рамки подсветят, что можно нажать.</span>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button onClick="{{ back }}" style="height:38px;padding:0 14px;border:1px solid #d5dbe8;border-radius:12px;background:#fff;color:#101320;font-size:13px;font-weight:500;white-space:nowrap">← Назад</button><button onClick="{{ showHot }}" style="height:38px;padding:0 14px;border:0;border-radius:12px;background:#eef0ff;color:#2f5bff;font-size:13px;font-weight:500;white-space:nowrap">Что нажать</button><button onClick="{{ restart }}" style="height:38px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:#2f5bff;font-size:13px;font-weight:500;white-space:nowrap">С заставки</button></div>
<span style="font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#5a6072;margin-top:8px">Путь</span>
<div style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ trail }}" as="t" hint-placeholder-count="3"><span style="font-size:12px;line-height:18px;color:{{ t.c }}">{{ t.l }}</span></sc-for></div>
</aside>
</div>
</div>
</x-dc>

    h9: [[/./, 'BACK']], h2: [[/./, 'BACK']], l1: [[/./, 'BACK']], w1: [[/./, 'BACK']], x1: [[/./, 'BACK']],
    tv2b: [[/Что входит|ещё|Подробнее|Все услуги/i, 'tv2c'], [/Оснащение/, 'rm1'], [/фото|Галере/i, 'gl1'], [/Выбрать|Забронировать|₽/, 'h5'], [/./, 'NONE']],
    tv2c: [[/Выбрать|Забронировать/, 'h5'], [/./, 'BACK']], rm1: [[/./, 'BACK']], gl1: [[/./, 'BACK']],
    h5: [[/Добавить к поездке|Ранний заезд, трансфер/, 'h6'], [/Далее|Продолжить|Дальше|Готово/, 'h7'], [/./, 'NONE']], h6: [[/Готово|Пропустить/, 'BACK'], [/./, 'NONE']],

    sv1: [[/Завтрак/, 'sv3'], [/./, 'sv2']], sv2: [[/./, 'BACK']], sv3: [[/./, 'BACK']],

    s3: [[/Счёт|Депозит/, 's5'], [/Поздний|Продлить/, 'TOAST:Выезд продлён до 15:00'], [/Wi/, 'wf1'], [/Все услуги|Услуги/, 'sv1'], [/Открыть|дверь/i, 'TOAST:Дверь открыта']],
    s4: [[/Отзыв|Оценить|Как вам|звёзд/i, 'x2'], [/Документ/, 'd2'], [/балл/i, 'v5'], [/Следующ|Найти/, 'f1'], [/Поездк|История/, 'p3']], x2: [[/./, 'BACK']],
    v1: [[/История/, 'v5'], [/Уровн|орбит/i, 'v2'], [/Все программ|Программы отелей|Все/, 'v4'], [/Mantera/, 'lp3'], [/Пригласить/, 'i1']], v2: [[/./, 'BACK']], v4: [[/Mantera/, 'lp3'], [/Сеть/, 'lp4'], [/./, 'lp1']], v5: [[/./, 'BACK']],
    lp1: [[/./, 'BACK']], lp2: [[/./, 'BACK']], lp3: [[/./, 'BACK']], lp4: [[/./, 'lp5']], lp5: [[/./, 'BACK']],
    p1: [[/стиль/i, 'p4'], [/оплат/i, 'p5'], [/Настройк/, 'p6'], [/Пригласить/, 'i1'], [/Поездк|История/, 'p3'], [/Уведомлен/, 'n2'], [/Friendly|отельер|статус/i, 'fr2'], [/Выгод|балл/i, 'v1']],
    p3: [[/Повторить|Mantera/, 'h1'], [/./, 'NONE']], p4: [[/./, 'BACK']], p5: [[/./, 'BACK']], p6: [[/./, 'BACK']], i1: [[/./, 'BACK']], i2: [[/./, 'BACK']],
    ch1: [[/Mantera|отел/i, 'ch2']], ch2: [[/./, 'NONE']], n2: [[/цен/i, 'pn3'], [/./, 'NONE']], pn3: [[/./, 'BACK']],
    fv1: [[/Море|осен|спис/i, 'fv2']], fv2: [[/Даты|гост|взр/, 'fv3'], [/заметк/i, 'fv6'], [/Mantera|₽/, 'h1']], fv2a: [[/./, 'BACK']], fv3: [[/./, 'BACK']], fv6: [[/./, 'BACK']],

  ICONS = [['M20 12H5', 'BACK'], ['M6 6l12 12', 'BACK'], ['M20.8 4.6', 'fv1'], ['M5 17h14', 'n2'], ['cx="5" cy="12" r="1"', 'fv2a']];
  TABS = { 'Поездки': 'HOME', 'Найти': 'f1', 'Чаты': 'ch1', 'Выгоды': 'v1' };
  STAGES = [['Онбординг', 'ob', 't1'], ['Нет брони', 't1', 't1'], ['До заезда', 'u1b', 'u1b'], ['Проживание', 's2', 's2'], ['Выезд', 's3', 's3'], ['После', 's4', 's4'], ['Отельер', 'z1', 't1']];
  componentDidMount() {
    this.onMsg = e => { if (e.data && e.data.kp === 'onboarding-done') this.nav('a1', 'S', true); };
    window.addEventListener('message', this.onMsg); window.__kc = this;
    fetch(encodeURI('Ключи - Все экраны.dc.html')).then(r => r.text()).then(t => {
      const doc = new DOMParser().parseFromString(t, 'text/html'), map = {};
      doc.querySelectorAll('[data-screen-label]').forEach(el => {
        const lab = el.getAttribute('data-screen-label'), id = lab.split(' ')[0];
        if (map[id] || !/^[a-z]/.test(id)) return;
        Object.assign(el.style, { border: '0', borderRadius: '0', boxShadow: 'none', margin: '0', width: '375px', boxSizing: 'border-box', minHeight: '800px' });
        if (el.style.height) el.style.height = '800px'; else el.style.overflow = 'clip';

        el.removeAttribute('data-screen-label');
        el.querySelectorAll('[data-comment-anchor]').forEach(x => x.removeAttribute('data-comment-anchor'));
        let ov = '';

      // даты / гости / даты+гости — нижние шторки поверх страницы, с которой открыты
      const asSheet = (id, bgId, title) => {
        if (!map[id] || !map[bgId] || map[id].sheet) return;
        const w = document.createElement('div'); w.innerHTML = map[id].html;
        const fr = w.firstElementChild;
        let parts = [...fr.children].filter(c => !/9:41/.test(c.textContent) || c.children.length > 3);
        if (parts.length === 1 && /inset:\s*0/.test(parts[0].getAttribute('style') || '')) parts = [...parts[0].children];
        parts = parts.filter(c => !(/9:41/.test(c.textContent) && c.textContent.length < 20));
        const sh = document.createElement('div');
        sh.setAttribute('style', 'position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;scrollbar-width:none;z-index:11;background:#f4f5fb;border-radius:30px 30px 0 0;padding:10px 0 26px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 32px #10132029');
        sh.innerHTML = '<span style="width:36px;height:5px;border-radius:3px;background:#d0d4df;align-self:center;flex:none"></span>';
        parts.forEach(p => { const st = p.getAttribute('style') || ''; if (/flex:\s*1/.test(st)) p.style.flex = 'none'; p.querySelectorAll('[style*="flex:1"],[style*="flex: 1"]').forEach(x => { if (!x.textContent.trim()) x.remove(); else x.style.flex = 'none'; }); sh.appendChild(p); });
        sh.querySelectorAll('[data-kc-cta]').forEach(x => { x.removeAttribute('data-kc-cta'); ['position', 'bottom', 'paddingTop', 'paddingBottom', 'marginBottom', 'background', 'boxShadow', 'zIndex'].forEach(k => x.style[k] = ''); });
        if (title) sh.querySelectorAll('span,div').forEach(x => { if (x.children.length === 0 && /^(Когда и кто|Даты поездки|Кто едет\??|Гости)$/.test(this.txt(x))) x.textContent = title; });
        const b = document.createElement('div'); b.innerHTML = map[bgId].html;
        const bg = b.firstElementChild;
        Object.assign(bg.style, { height: '800px', minHeight: '800px', overflow: 'hidden', position: 'relative' });
        bg.querySelectorAll('[data-kc-cta]').forEach(x => x.removeAttribute('data-kc-cta'));
        bg.insertAdjacentHTML('beforeend', '<div data-kc-dim="" style="position:absolute;inset:0;background:#10132059;z-index:10"></div>');
        bg.appendChild(sh);
