<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ключи — запуск и вход</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="splash/splash-animation.css">
<style>
:root{--brand:#3a66f0;--tint:#eef2fe;--ink:#14171f;--muted:#6b7280;--line:#eceef2;--bg:#f7f8fa;--ok:#16865a;--okTint:#e6f6ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#eef0f4;font-family:"Golos Text",system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}
.phone{width:320px;height:700px;border-radius:46px;border:9px solid #111318;overflow:hidden;position:relative;background:var(--brand);transition:background .6s ease;box-shadow:0 20px 40px #14171f26}
.phone.light{background:var(--bg)}
.sbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:12px 24px 0;font-size:13px;font-weight:500;color:#fff;transition:color .6s;z-index:3}
.phone.light .sbar{color:var(--ink)}
/* splash */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:none;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.phone.up .splash{transform:translateY(-232px) scale(.5)}
.splash svg{display:block;overflow:visible}
.splash:not(.k-anim) .k-shaft{opacity:0}
.splash svg *{transition:fill .6s,stroke .6s}
.phone.up .k-fg{fill:var(--brand)} .phone.up .k-ring{stroke:var(--brand)} .phone.up .k-halo{fill:var(--bg)}
.word{font:600 40px/1 "Golos Text";letter-spacing:-1.8px;color:#fff;transition:color .6s}
.phone.up .word{color:var(--ink)}
.cap{font-size:15px;line-height:22px;color:#e3eaff;transition:opacity .3s}
.phone.up .cap{opacity:0}
/* form */
.step{position:absolute;left:16px;right:16px;top:196px;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.step.on{opacity:1;transform:none;pointer-events:auto}
.h1{font-size:24px;line-height:30px;font-weight:500;letter-spacing:-.4px}
.p{font-size:14px;line-height:21px;color:var(--muted)}
.field{height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;transition:border-color .2s}
.field.typing{border-color:#c9d6fd}.field.ready{border-color:var(--brand)}
.field .cc{font-size:16px;font-weight:500}.field .sep{width:1px;height:22px;background:var(--line)}
.field .num{font-size:16px;letter-spacing:.3px;color:#a3a8b3}.field.typing .num,.field.ready .num{color:var(--ink)}
.field{cursor:text}
.caret{width:2px;height:20px;background:var(--brand);margin-left:-8px;animation:blink 1s steps(1) infinite;display:none}
.field.focus .caret{display:block}.field.focus:not(.ready){border-color:var(--brand)}
@keyframes blink{50%{opacity:0}}
.btn{height:48px;border:0;border-radius:14px;background:#b8c6f4;color:#fff;font-size:14px;font-weight:500;transition:background .2s}
.btn.ready{background:var(--brand)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;line-height:18px;color:var(--muted)}
.link{border:0;background:none;padding:0;color:var(--brand);font-size:12px;font-weight:500}
.back{width:32px;height:32px;margin-left:-6px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{height:60px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:26px;font-weight:500;transition:all .25s}
.cell.filled{border-color:#c9d6fd}.cell.active{border-color:var(--brand)}
.cells.check .cell{background:var(--tint);border-color:var(--brand);color:var(--brand)}
.cells.ok .cell{background:var(--okTint);border-color:var(--ok);color:var(--ok)}
.status{display:flex;align-items:center;gap:8px;min-height:21px;font-size:14px;line-height:21px;color:var(--muted)}
.status.check{color:var(--brand)}.status.ok{color:var(--ok)}
.spin{width:16px;height:16px;display:none;animation:spin .9s linear infinite}
.status.check .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
/* keypad */
.pad{position:absolute;left:0;right:0;bottom:0;background:#e4e7ec;padding:8px 6px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:2}
.pad.on{transform:none}
.key{height:46px;border:0;border-radius:10px;background:#fff;box-shadow:0 1px 0 #14171f33;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.key b{font-size:22px;font-weight:400}.key i{font-style:normal;font-size:9px;letter-spacing:1.5px;color:#5d6472;margin-top:2px}
.key.ghost{background:transparent;box-shadow:none}
/* app */
.app{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:-20px 0 40px #14171f22;z-index:4}
.app.on{transform:none}
.nav{position:absolute;left:12px;right:12px;bottom:14px;height:62px;padding:4px;border-radius:31px;background:#ffffffc4;border:1px solid #fff;backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 8px 24px #14171f1f;display:grid;grid-template-columns:repeat(4,1fr)}
.nav div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:27px;font-size:11px;font-weight:500;line-height:13px}
.nav .cur{background:var(--tint);color:var(--brand)}
.ctrl{display:flex;gap:8px}
.ctrl button{height:40px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:500}
@media (prefers-reduced-motion:reduce){.splash,.step,.pad,.app{transition-duration:.01s}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="sbar"><span>9:41</span><span>●●●</span></div>
  <div class="splash" id="splash">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <g class="k-stage">
        <g class="k-shaft">
          <rect class="k-fg" x="126" y="68.75" width="104" height="22.5" rx="11.25" fill="#fff"/>
          <rect class="k-fg" x="196" y="80" width="18" height="30" rx="5" fill="#fff"/>
        </g>
        <circle class="k-ring" cx="80" cy="80" r="48.75" fill="none" stroke="#fff" stroke-width="22.5"/>
        <g class="k-orbit" style="transform-box:view-box;transform-origin:80px 80px;transform:rotate(315deg)">
          <circle class="k-halo" cx="128.75" cy="80" r="27.2" fill="#3a66f0"/>
          <circle class="k-ball k-fg" cx="128.75" cy="80" r="20" fill="#fff"/>
        </g>
      </g>
    </svg>
    <div class="word k-fade">ключи</div>
    <div class="cap k-fade">Ключи от любого отеля</div>
  </div>

  <div class="step" id="stepPhone">
    <div style="display:flex;flex-direction:column;gap:6px"><div class="h1">Вход</div><div class="p">Номер телефона</div></div>
    <div class="field" id="field" role="textbox" tabindex="0"><span class="cc">+7</span><span class="sep"></span><span class="num" id="num">000 000-00-00</span><span class="caret" id="caret"></span></div>
    <button class="btn" id="getCode">Продолжить</button>
    <div class="row" style="justify-content:center;text-align:center"><span>Продолжая, вы принимаете <a href="#">условия</a></span></div>
  </div>

  <div class="step" id="stepCode" style="gap:16px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px"><button class="back" id="back" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5m6-6-6 6 6 6"/></svg></button><div class="h1">Код из SMS</div></div>
      <div class="p" id="sent"></div>
    </div>
    <div class="cells" id="cells"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
    <div class="status" id="status"><svg class="spin" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#c9d6fd" stroke-width="2.5"/><circle cx="13.5" cy="8" r="2.4" fill="#3a66f0"/></svg><span id="statusT"></span></div>
  </div>

  <div class="pad" id="pad"></div>

  <div class="app" id="app">
    <div style="display:flex;justify-content:space-between;padding:12px 24px 0;font-size:13px;font-weight:500"><span>9:41</span><span>●●●</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px 0">
      <div style="display:flex;align-items:center;gap:7px"><img src="assets/keys-orbit-symbol-blue.svg" width="20" height="20" alt=""><span style="font:600 22px/1 'Golos Text';letter-spacing:-1px">ключи</span></div>
      <div style="width:40px;height:40px;border-radius:50%;background:#e6ecfe;display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--brand)">ТК</div>
    </div>
    <div style="padding:16px 16px 0"><div style="font-size:13px;color:var(--muted)">Добро пожаловать, Татьяна</div><div class="h1">Куда отправимся?</div><div style="font-size:13px;color:var(--muted);margin-top:4px">Броней пока нет — начнём с выбора отеля.</div></div>
    <div style="margin:16px 16px 0;border-radius:24px;background:var(--brand);color:#fff;padding:16px">
      <div style="font-size:17px;line-height:24px;font-weight:500">За новыми впечатлениями</div>
      <div style="display:flex;gap:10px;margin-top:12px"><img src="assets/next-trip.jpg" style="flex:1;min-width:0;height:96px;object-fit:cover;border-radius:12px" alt=""><img src="assets/maidens-hotel.jpg" style="flex:1;min-width:0;height:96px;object-fit:cover;border-radius:12px" alt=""></div>
      <button style="margin-top:12px;width:100%;height:48px;border:0;border-radius:14px;background:#fff;color:var(--brand);font-size:14px;font-weight:500">Подобрать отель</button>
    </div>
    <div class="nav">
      <div class="cur"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="14" rx="3"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3M9 11v6m6-6v6"/></svg>Поездки</div>
      <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Найти</div>
      <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 2 1.5-5A8 8 0 1 1 20 11.5Z"/><path d="M7 10h9m-9 4h5"/></svg>Чаты</div>
      <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M12 7v14M3 7h18v4H3z"/><path d="M12 7C7 7 5 6 5 4a2 2 0 0 1 4-1l3 4Zm0 0c5 0 7-1 7-3a2 2 0 0 0-4-1l-3 4Z"/></svg>Выгоды</div>
    </div>
  </div>
</div>
<div class="ctrl">
  <button id="replay" style="border:0;background:var(--brand);color:#fff">Повторить с начала</button>
  <button id="skip" style="border:1px solid #d5dbe8;background:#fff;color:var(--ink)">К вводу телефона</button>
</div>
<script>
// Тайминги (мс) — синхронизированы с splash-animation.css (2.0s)
const T = { liftLogo: 2050, showForm: 2450, verify: 1200, success: 700 };
const $ = id => document.getElementById(id);
const phone = $('phone'), splash = $('splash');
let num = '', code = '', step = 'splash', timers = [], tick, left = 45, busy = false, focus = false;
const later = (ms, f) => timers.push(setTimeout(f, ms));
const fmt = n => { const a=n.slice(0,3),b=n.slice(3,6),c=n.slice(6,8),d=n.slice(8,10); let r=''; if(a) r+='('+a+(a.length===3?') ':''); if(b) r+=b; if(c) r+='-'+c; if(d) r+='-'+d; return r; };
const letters = {2:'АБВГ',3:'ДЕЖЗ',4:'ИЙКЛ',5:'МНОП',6:'РСТУ',7:'ФХЦЧ',8:'ШЩЪЫ',9:'ЬЭЮЯ'};
['1','2','3','4','5','6','7','8','9','','0','del'].forEach(d => {
  const b = document.createElement('button');
  b.className = 'key' + (d === '' || d === 'del' ? ' ghost' : '');
  b.innerHTML = d === 'del' ? '<b>⌫</b>' : `<b>${d}</b><i>${letters[d] || ''}</i>`;
  if (d) b.onclick = () => press(d);
  $('pad').appendChild(b);
});
function render() {
  $('num').textContent = num ? fmt(num) : '000 000-00-00';
  $('field').className = 'field' + (num.length === 10 ? ' ready' : num ? ' typing' : '') + (focus ? ' focus' : '');
  $('getCode').className = 'btn' + (num.length === 10 ? ' ready' : '');
  [...$('cells').children].forEach((c, i) => { c.textContent = code[i] || ''; c.className = 'cell' + (code[i] ? ' filled' : '') + (!busy && step === 'code' && i === code.length ? ' active' : ''); });
  if (!busy) $('statusT').textContent = left > 0 ? 'Новый код через 0:' + String(left).padStart(2, '0') : 'Отправить ещё раз';
}
function go(s) {
  step = s;
  $('stepPhone').classList.toggle('on', s === 'phone');
  $('stepCode').classList.toggle('on', s === 'code');
  if (s !== 'phone') focus = false;
  $('pad').classList.toggle('on', s === 'code' || (s === 'phone' && focus));
  $('app').classList.toggle('on', s === 'app');
  render();
}
function press(d) {
  if (step === 'phone') num = d === 'del' ? num.slice(0, -1) : (num.length < 10 ? num + d : num);
  else if (step === 'code' && !busy) {
    code = d === 'del' ? code.slice(0, -1) : (code.length < 4 ? code + d : code);
    if (code.length === 4) verify();
  }
  render();
}
function verify() {
  busy = true; $('cells').className = 'cells check'; $('status').className = 'status check'; $('statusT').textContent = 'Проверяем код…';
  later(T.verify, () => { $('cells').className = 'cells ok'; $('status').className = 'status ok'; $('statusT').textContent = 'Готово, входим'; });
  later(T.verify + T.success, () => go('app'));
}
$('getCode').onclick = () => {
  if (num.length !== 10) return;
  code = ''; busy = false; left = 45; $('cells').className = 'cells'; $('status').className = 'status';
  $('sent').textContent = 'Отправили на +7 ' + fmt(num);
  clearInterval(tick); tick = setInterval(() => { if (step !== 'code' || left <= 0) return clearInterval(tick); left--; render(); }, 1000);
  go('code');
};
$('field').onclick = e => { e.stopPropagation(); focus = true; go('phone'); };
$('stepPhone').onclick = e => { if (e.target.closest('#getCode,#field,a')) return; focus = false; go('phone'); };
$('back').onclick = () => { code = ''; busy = false; focus = true; go('phone'); };
function start(skip) {
  timers.forEach(clearTimeout); timers = []; clearInterval(tick);
  num = ''; code = ''; busy = false; focus = false;
  splash.classList.remove('k-anim'); phone.classList.remove('up', 'light'); go('splash');
  void splash.offsetWidth;
  if (skip || matchMedia('(prefers-reduced-motion: reduce)').matches) { phone.classList.add('up', 'light'); later(100, () => go('phone')); return; }
  splash.classList.add('k-anim');
  later(T.liftLogo, () => phone.classList.add('up', 'light'));
  later(T.showForm, () => go('phone'));
}
$('replay').onclick = () => start();
$('skip').onclick = () => start(true);
start();
</script>
</body>
</html>
