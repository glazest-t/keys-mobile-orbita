<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ключи — заставка</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--keys-blue:#3a66f0;--orbit-size:120px;--orbit-duration:2.4s;--orbit-ease:cubic-bezier(.6,.1,.4,.9)}
html,body{margin:0;height:100%}
.splash{height:100%;background:var(--keys-blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:"Golos Text",system-ui,sans-serif}
.orbit{position:relative;width:var(--orbit-size);height:var(--orbit-size)}
/* кольцо: толщина 0.1875 от диаметра */
.orbit__ring{position:absolute;inset:0;border-radius:50%;border:calc(var(--orbit-size)*.1875) solid #fff;box-sizing:border-box}
/* точка: диаметр 1/3, лежит на средней линии кольца; отступ 0.06 = цвет фона */
.orbit__track{position:absolute;inset:0;animation:orbit var(--orbit-duration) var(--orbit-ease) infinite}
.orbit__dot{position:absolute;left:50%;top:calc(var(--orbit-size)*.09375);width:calc(var(--orbit-size)/3);height:calc(var(--orbit-size)/3);border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 calc(var(--orbit-size)*.06) var(--keys-blue)}
.wordmark{font-weight:600;font-size:34px;letter-spacing:-1.5px;line-height:1}
.tagline{position:absolute;bottom:40px;font-size:14px;color:#e3eaff}
@keyframes orbit{from{transform:rotate(45deg)}to{transform:rotate(405deg)}}
@media (prefers-reduced-motion:reduce){.orbit__track{animation:none;transform:rotate(45deg)}}
</style></head>
<body><div class="splash" role="img" aria-label="Ключи">
<div class="orbit"><div class="orbit__ring"></div><div class="orbit__track"><div class="orbit__dot"></div></div></div>
<div class="wordmark">ключи</div><div class="tagline">Отели, которые знают вас</div>
</div></body></html>
