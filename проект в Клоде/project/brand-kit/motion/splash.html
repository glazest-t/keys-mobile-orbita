<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ключи — заставка (исходник)</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
/* Ключи — заставка 2 с. Геометрия: знак D=80, кольцо 15, точка 26.7 (D/3), ореол 4.8 цвета фона.
   Кривые: orbit cubic-bezier(.65,0,.35,1), arrive cubic-bezier(.2,.8,.2,1). Перезапуск — клик по экрану. */
:root{--c:#2f5bff;--bg:#eef0ff;--ink:#101320;--d:2s;--orbit:cubic-bezier(.65,0,.35,1);--arrive:cubic-bezier(.2,.8,.2,1)}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 38%,#fff 0%,#eef0ff 50%,#dfe5ff 80%,#d6f1ff 100%);overflow:hidden;cursor:pointer}
.stage{position:relative;width:302px;height:200px;animation:lift var(--d) var(--arrive) both}
.slide{position:absolute;inset:0;animation:slide var(--d) var(--orbit) both}
.key{position:absolute;inset:0;transform-origin:116px 100px;animation:in .35s var(--arrive) both}
.ring{position:absolute;left:76px;top:60px;width:80px;height:80px;border-radius:50%;border:15px solid var(--c);box-sizing:border-box}
.shaft{position:absolute;left:152px;top:94px;width:74px;height:12px;border-radius:6px;background:var(--c);transform-origin:0 50%;animation:shaft var(--d) var(--orbit) both}
.tooth{position:absolute;top:102px;width:10px;border-radius:3px;background:var(--c);animation:teeth var(--d) linear both}
.t1{left:196px;height:17px}.t2{left:212px;height:12px}
.orbitbox{position:absolute;left:76px;top:60px;width:80px;height:80px;transform:rotate(90deg)}
.orbit{position:absolute;inset:0;animation:orbit var(--d) var(--orbit) both}
.dot{position:absolute;left:26.65px;top:-5.85px;width:26.7px;height:26.7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4.8px var(--bg);animation:grow var(--d) var(--orbit) both}
.word{position:absolute;left:116px;top:79px;font:500 36px/42px 'Unbounded',sans-serif;letter-spacing:-1.8px;color:var(--ink);white-space:nowrap;animation:word var(--d) var(--arrive) both}
@keyframes in{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
@keyframes shaft{0%,22%{transform:scaleX(1);opacity:1}42%{transform:scaleX(0);opacity:1}43%,100%{transform:scaleX(0);opacity:0}}
@keyframes teeth{0%,20%{opacity:1}30%,100%{opacity:0}}
@keyframes grow{0%,22%{transform:scale(.44)}42%,100%{transform:scale(1)}}
@keyframes orbit{0%,42%{transform:rotate(0)}78%,100%{transform:rotate(315deg)}}
@keyframes slide{0%,48%{transform:translateX(0)}82%,100%{transform:translateX(-60px)}}
@keyframes word{0%,55%{opacity:0;transform:translateX(-14px)}85%,100%{opacity:1;transform:none}}
@keyframes lift{0%,88%{transform:none}100%{transform:translateY(-238px) scale(.56)}}
@media (prefers-reduced-motion:reduce){.stage,.slide,.key,.shaft,.tooth,.orbit,.dot,.word{animation-duration:1ms}}
</style>
</head>
<body onclick="const s=document.querySelector('.stage');const c=s.cloneNode(true);s.replaceWith(c)">
<div class="stage">
  <div class="slide"><div class="key">
    <div class="ring"></div><div class="shaft"></div><div class="tooth t1"></div><div class="tooth t2"></div>
    <div class="orbitbox"><div class="orbit"><div class="dot"></div></div></div>
  </div></div>
  <div class="word">ключи</div>
</div>
</body>
</html>
