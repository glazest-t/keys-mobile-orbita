*{box-sizing:border-box}html,body{margin:0;overflow:visible}body{font-family:Onest;color:#13203a}.poster{position:relative;overflow:hidden;background:#edf4ff;display:flex;flex-direction:column;padding:70px 76px 62px;--accent:#2f5bff}.poster.blue{background:#2f5bff;color:white;--accent:#c2ecff}.brandline{display:flex;justify-content:space-between;align-items:center;margin-bottom:65px}.brand{width:182px;height:46px;object-fit:contain;object-position:left}.label{font:450 23px Onest;letter-spacing:.1px;opacity:.8}.copy{flex:none}h1{font:650 77px/1.1 Onest;letter-spacing:-2.9px;margin:0}em{font-style:normal;color:var(--accent)}p{font:400 31px/1.4 Onest;margin:32px 0 0;color:#4f6079}.blue p{color:#dce9ff}.visual{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;padding:55px 0 34px}.screen{position:relative;overflow:hidden;background:#f7f9ff;flex:none;box-shadow:0 16px 52px #112c5519;border-radius:34px;outline:1px solid #ffffff55}.screen img{display:block;width:100%;height:auto}.endline{display:flex;justify-content:space-between;align-items:center;font:400 20px Onest;opacity:.65;flex:none}.ticks{display:flex;gap:8px}.ticks i{display:block;width:24px;height:4px;border-radius:4px;background:currentColor;opacity:.25}.ticks i.active{opacity:1;width:48px}

(async()=>{const q=new URLSearchParams(location.search),slides=await(await fetch('/source/slides-v2.json',{cache:'no-store'})).json(),n=Number(q.get('slide')||0),s=slides[n],format=q.get('format')||'android',sizes={android:[1080,1920],large:[1320,2868],medium:[1206,2622]},[w,h]=sizes[format],k=w/1080,poster=document.querySelector('#poster');document.documentElement.style.cssText=`width:${w}px;height:${h}px`;document.body.style.cssText=`width:${w}px;height:${h}px`;poster.style.cssText=`width:1080px;height:${h/k}px;transform:scale(${k});transform-origin:top left`;poster.classList.add(s.tone);brand.src=s.tone==='blue'?'/assets/logo-white.svg':'/assets/logo.svg';label.textContent=s.label;title.innerHTML=s.title;subtitle.innerHTML=s.subtitle;ticks.innerHTML=slides.map((_,i)=>`<i class="${n===i?'active':''}"></i>`).join('');shot.src='/source/screens/'+s.id+'.jpg?revision=2';await Promise.all([document.fonts.ready,new Promise(r=>shot.onload=r)]);const area=visual.getBoundingClientRect(),available=area.height/k-89,ratio=s.cropHeight/393,sw=Math.min(928,available/ratio),sh=sw*ratio;document.querySelector('#screen').style.width=sw+'px';document.querySelector('#screen').style.height=sh+'px';document.title=s.id+' · v2 · '+format;poster.dataset.ready='true';})();
