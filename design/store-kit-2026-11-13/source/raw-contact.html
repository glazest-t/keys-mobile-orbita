<!doctype html><meta charset="utf-8"><style>body{margin:0;padding:20px;background:#e8ecf2;font:16px Arial}main{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}img{width:100%}figure{margin:0}</style><main id="grid"></main><script>fetch('/source/slides-v2.json',{cache:'no-store'}).then(r=>r.json()).then(a=>grid.innerHTML=a.map(s=>`<figure><img src="/source/screens/${s.id}.jpg"><figcaption>${s.id}</figcaption></figure>`).join(''))</script>
